<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="description" content="Anvesh Chat Bot is your intelligent conversational companion with coding assistance, real-time news updates, and natural conversations - powered by advanced AI technology.">
    
    <!-- Open Graph tags -->
    <meta property="og:title" content="Anvesh Chat Bot - Your Intelligent Assistant" />

    <meta property="og:type" content="website" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <body>

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">

            <button class="p-2 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100 transition-colors">
              <i class="fas fa-cog"></i>
            </button>
            <button class="p-2 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100 transition-colors">
              <i class="fas fa-question-circle"></i>
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="max-w-7xl mx-auto">
      <div id="root"></div>
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
